<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover" />
    <title>OP Embedded BLE</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="app-shell">
      <header>
        <div>
          <h1>OP Embedded</h1>
          <p class="subtitle">BLE 图片传输</p>
        </div>
        <button id="connectionBadge" class="badge mode-trigger mode-ble" type="button"
                aria-label="切换上传模式" title="切换上传模式">蓝牙</button>
      </header>

      <section class="editor-card">
        <div class="section-heading">
          <div class="heading-copy">
            <h2>预览</h2>
            <p id="fileSummary">支持照片、PNG 序列或短视频，目标 466 × 466 圆屏。</p>
          </div>
          <button id="editButton" class="edit-button" disabled>编辑</button>
        </div>

        <div id="previewWrap" class="preview-wrap locked">
          <canvas id="previewCanvas" width="466" height="466"></canvas>
          <div class="round-guide"></div>
          <p id="emptyPreview">请先选择图片</p>
          <p id="editHint" class="edit-hint" hidden>单指移动 · 双指缩放</p>
        </div>

        <div id="editControls" class="edit-controls" aria-hidden="true">
          <div class="color-control">
            <span>背景颜色</span>
            <input id="backgroundInput" type="hidden" value="#000000" />
            <div id="backgroundPalette" class="color-palette" role="group" aria-label="背景颜色">
              <button class="color-swatch selected" type="button" data-color="#000000" aria-label="黑色" aria-pressed="true"></button>
              <button class="color-swatch" type="button" data-color="#ffffff" aria-label="白色" aria-pressed="false"></button>
              <button class="color-swatch" type="button" data-color="#8e8e93" aria-label="灰色" aria-pressed="false"></button>
              <button class="color-swatch" type="button" data-color="#ff453a" aria-label="红色" aria-pressed="false"></button>
              <button class="color-swatch" type="button" data-color="#0a84ff" aria-label="蓝色" aria-pressed="false"></button>
            </div>
          </div>
          <button id="resetButton" class="text-button">重置画面</button>
        </div>
      </section>

      <section id="firmwareSheet" class="firmware-sheet" aria-label="固件烧录" hidden>
        <div class="advanced-settings-heading">
          <div>
            <h2>固件烧录</h2>
            <p id="firmwareProfileHint">通过 USB OTG 写入当前屏幕方案的预编译固件</p>
          </div>
          <button id="closeFirmwareButton" class="sheet-close" type="button" aria-label="关闭固件烧录">×</button>
        </div>
        <p class="firmware-note">请连接 USB OTG，必要时按住 BOOT 再点击复位。固件烧录不会上传图片内容。</p>
        <div class="firmware-actions">
          <button id="flashUsbFirmwareButton" class="firmware-choice" type="button">
            <span>USB 固件</span><small>USB 内容传输版本</small>
          </button>
          <button id="flashBleFirmwareButton" class="firmware-choice" type="button">
            <span>BLE 固件</span><small>BLE 内容传输版本</small>
          </button>
        </div>
      </section>

      <section class="settings-panel" aria-label="屏幕设置">
        <div class="settings-row profile-row">
          <div class="setting-label">
            <span>屏幕方案</span>
            <small>选择设备当前刷入的屏幕固件</small>
          </div>
          <div class="profile-select">
            <button id="deviceProfileControl" class="profile-trigger" type="button" aria-label="屏幕方案" aria-haspopup="listbox" aria-expanded="false">
              <span id="deviceProfileLabel" class="profile-trigger-label">Waveshare 1.75C · 466 × 466</span>
              <span class="profile-chevron" aria-hidden="true"></span>
            </button>
            <div id="deviceProfileMenu" class="profile-menu" role="listbox" aria-label="屏幕方案选项" hidden>
              <button type="button" role="option" data-value="co5300_waveshare_amoled_1_75c" aria-selected="true">
                <span>Waveshare 1.75C</span><small>466 × 466 · 圆屏</small>
              </button>
              <button type="button" role="option" data-value="co5300_m5stack_stopwatch" aria-selected="false">
                <span>M5Stack StopWatch</span><small>466 × 466 · 圆屏</small>
              </button>
              <button type="button" role="option" data-value="ili9342_m5stack_cores3" aria-selected="false">
                <span>M5Stack CoreS3</span><small>320 × 240 · 横屏</small>
              </button>
            </div>
          </div>
        </div>
      </section>

      <section id="advancedSettings" class="advanced-settings" aria-label="设置" hidden>
        <div class="settings-row">
          <div class="setting-label">
            <span>视频帧率</span>
            <small>帧数越高，占用越大</small>
          </div>
          <div id="fpsControl" class="segmented-control compact" role="group" aria-label="视频帧率" data-value="20">
            <button type="button" data-value="8" aria-pressed="false">8</button>
            <button type="button" data-value="12" aria-pressed="false">12</button>
            <button class="selected" type="button" data-value="20" aria-pressed="true">20</button>
          </div>
        </div>
        <div class="settings-divider"></div>
        <div class="settings-row strategy-row">
          <div class="setting-label">
            <span>容量不足时</span>
            <small>决定超限内容如何处理</small>
          </div>
          <div id="overflowStrategyControl" class="segmented-control strategy-control" role="group" aria-label="容量不足时" data-value="speed">
            <button class="selected" type="button" data-value="speed" aria-pressed="true">完整加速</button>
            <button type="button" data-value="trim" aria-pressed="false">裁切结尾</button>
          </div>
        </div>
        <div class="settings-row settings-action-row">
          <div class="setting-label">
            <span>固件烧录</span>
            <small>初始化设备屏幕方案</small>
          </div>
          <button id="firmwareButton" class="settings-action-button" type="button">打开</button>
        </div>
      </section>

      <section class="transfer-status">
        <div class="status-copy">
          <p id="statusText" class="status">选择图片后即可上传</p>
          <p id="payloadSummary" class="payload-summary">尚未准备内容</p>
        </div>
        <div class="progress-track"><div id="progressBar"></div></div>
        <p id="diagnosticText" class="diagnostic" aria-live="polite" hidden>BLE diagnostics: idle</p>
        <pre id="firmwareLog" class="firmware-log" hidden></pre>
      </section>

      <footer class="action-bar">
        <button id="settingsButton" class="action-icon" type="button" aria-label="设置" title="设置" aria-expanded="false" aria-controls="advancedSettings">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.38a2 2 0 0 0-.73-2.73l-.15-.09a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z" />
            <circle cx="12" cy="12" r="3" />
          </svg>
        </button>
        <button id="cameraButton" class="action-icon" type="button" aria-label="拍照" title="拍照">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M8.2 5.5 9.4 3.8h5.2l1.2 1.7H19a2 2 0 0 1 2 2v10.2a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V7.5a2 2 0 0 1 2-2h3.2Z" />
            <circle cx="12" cy="12.5" r="4" />
          </svg>
        </button>
        <label class="action-icon" aria-label="导入媒体" title="导入照片或视频">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <rect x="3" y="4" width="18" height="16" rx="2.5" />
            <circle cx="9" cy="9" r="1.5" />
            <path d="m5.5 17 4.1-4.1 3 3 2.2-2.2 3.7 3.3" />
          </svg>
          <input id="fileInput" type="file" accept="image/png,image/jpeg,image/webp,image/bmp,video/*" multiple />
        </label>
        <button id="uploadButton" class="primary" disabled>上传到设备</button>
      </footer>
    </main>

    <script src="protocol.js"></script>
    <script src="app.js"></script>
  </body>
</html>
