<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover" />
    <title>OP Embedded BLE</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="app-shell">
      <header>
        <div>
          <h1>OP Embedded</h1>
          <p class="subtitle">BLE 图片传输</p>
        </div>
        <span id="connectionBadge" class="badge">按需连接</span>
      </header>

      <section class="editor-card">
        <div class="section-heading">
          <div class="heading-copy">
            <h2>预览</h2>
            <p id="fileSummary">支持照片、PNG 序列或短视频，目标 466 × 466。</p>
          </div>
          <button id="editButton" class="edit-button" disabled>编辑</button>
        </div>

        <div id="previewWrap" class="preview-wrap locked">
          <canvas id="previewCanvas" width="466" height="466"></canvas>
          <div class="round-guide"></div>
          <p id="emptyPreview">请先选择图片</p>
          <p id="editHint" class="edit-hint" hidden>单指移动 · 双指缩放</p>
        </div>

        <div id="editControls" class="edit-controls" aria-hidden="true">
          <div class="color-control">
            <span>背景颜色</span>
            <input id="backgroundInput" type="hidden" value="#000000" />
            <div id="backgroundPalette" class="color-palette" role="group" aria-label="背景颜色">
              <button class="color-swatch selected" type="button" data-color="#000000" aria-label="黑色" aria-pressed="true"></button>
              <button class="color-swatch" type="button" data-color="#ffffff" aria-label="白色" aria-pressed="false"></button>
              <button class="color-swatch" type="button" data-color="#8e8e93" aria-label="灰色" aria-pressed="false"></button>
              <button class="color-swatch" type="button" data-color="#ff453a" aria-label="红色" aria-pressed="false"></button>
              <button class="color-swatch" type="button" data-color="#0a84ff" aria-label="蓝色" aria-pressed="false"></button>
            </div>
          </div>
          <button id="resetButton" class="text-button">重置画面</button>
        </div>
      </section>

      <section class="settings-panel" aria-label="视频设置">
        <div class="settings-row">
          <div class="setting-label">
            <span>视频帧率</span>
            <small>帧数越高，占用越大</small>
          </div>
          <div id="fpsControl" class="segmented-control compact" role="group" aria-label="视频帧率" data-value="12">
            <button type="button" data-value="8" aria-pressed="false">8</button>
            <button class="selected" type="button" data-value="12" aria-pressed="true">12</button>
            <button type="button" data-value="20" aria-pressed="false">20</button>
          </div>
        </div>
        <div class="settings-divider"></div>
        <div class="settings-row strategy-row">
          <div class="setting-label">
            <span>容量不足时</span>
            <small>决定超限内容如何处理</small>
          </div>
          <div id="overflowStrategyControl" class="segmented-control strategy-control" role="group" aria-label="容量不足时" data-value="speed">
            <button class="selected" type="button" data-value="speed" aria-pressed="true">完整加速</button>
            <button type="button" data-value="trim" aria-pressed="false">裁切结尾</button>
          </div>
        </div>
      </section>

      <section class="transfer-status">
        <div class="status-copy">
          <p id="statusText" class="status">选择图片后即可上传</p>
          <p id="payloadSummary" class="payload-summary">尚未准备内容</p>
        </div>
        <div class="progress-track"><div id="progressBar"></div></div>
        <p id="diagnosticText" class="diagnostic" aria-live="polite">BLE diagnostics: idle</p>
      </section>

      <footer class="action-bar">
        <button id="cameraButton" class="action-icon" type="button" aria-label="拍照" title="拍照">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M8.2 5.5 9.4 3.8h5.2l1.2 1.7H19a2 2 0 0 1 2 2v10.2a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V7.5a2 2 0 0 1 2-2h3.2Z" />
            <circle cx="12" cy="12.5" r="4" />
          </svg>
        </button>
        <label class="action-icon" aria-label="导入媒体" title="导入照片或视频">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <rect x="3" y="4" width="18" height="16" rx="2.5" />
            <circle cx="9" cy="9" r="1.5" />
            <path d="m5.5 17 4.1-4.1 3 3 2.2-2.2 3.7 3.3" />
          </svg>
          <input id="fileInput" type="file" accept="image/png,image/jpeg,image/webp,image/bmp,video/*" multiple />
        </label>
        <button id="uploadButton" class="primary" disabled>上传到设备</button>
      </footer>
    </main>

    <script src="protocol.js"></script>
    <script src="app.js"></script>
  </body>
</html>
